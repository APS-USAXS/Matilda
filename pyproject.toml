[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"


[project]
name = "Matilda"
dynamic = ["version"]
description = "Live data processing package for USAXS/SAXS/WAXS instrument"
readme = "README.md"
authors = [
    { name = "Jan Ilavsky", email = "ilavsky@anl.gov" },
]
# license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core runtime dependencies (verified used in source code).
# GUI dependencies (PyQt6, pyqtgraph) are listed separately below so the
# headless server install can omit them if needed.
# NOTE: netcdf4, pandas, tqdm, xarray were listed previously but do not
#       appear to be imported in any current source file — removed pending
#       confirmation that they are not needed.
dependencies = [
    "h5py",
    "matplotlib",       # used in plotData.py; target for replacement with pyqtgraph
    "numpy",
    "pyFAI",
    "requests",
    "scipy",
    "tifffile",
]

[project.optional-dependencies]
# Install with: pip install matilda[gui]
# GUI tools use PySide6 (preferred) or PyQt6 as fallback + pyqtgraph for plotting.
# IMPORTANT: install only ONE of PySide6 or PyQt6 — having both on the same
# environment causes Qt platform-plugin conflicts on macOS ("cocoa not found").
# PySide6 is listed here as the default.  Users who prefer PyQt6 should install
# it manually and NOT use this extras group.
# matplotlib is intentionally NOT listed here: it is a core headless dep.
gui = [
    "PySide6>=6.4,<6.8",  # 6.8+ requires GLIBC 2.32; RHEL 8 only has GLIBC 2.28
    "pyqtgraph",
    "pyepics",
]
# Install with: pip install matilda[dev]
dev = [
    "pytest",
    "pytest-cov",
]
# Install everything for a full local development setup:
#   pip install -e .[gui,dev]
all = [
    "PySide6>=6.4,<6.8",  # 6.8+ requires GLIBC 2.32; RHEL 8 only has GLIBC 2.28
    "pyqtgraph",
    "pyepics",
    "pytest",
    "pytest-cov",
]

[project.scripts]
# Allows running 'matilda' on the command line after install.
# BUG-01 fixed: bare imports converted to relative imports; main() function added.
# Service launch: update serv_matilda.sh to use 'python -m matilda.matilda'
# (or rely on the 'matilda' console script after pip install).
matilda = "matilda.matilda:main"

# GUI tool entry points (require pip install matilda[gui]):
matilda-sample-plates = "matilda.gui.sample_plate_setup:run_sample_plate_setup"
matilda-gui = "matilda.gui.data_reduction:main"

[tool.hatch.build.targets.wheel]
# Package matilda/ and its subpackages (gui/, reduction/).
# tests/ is intentionally excluded from the wheel.
packages = ["matilda"]

[tool.pytest.ini_options]
testpaths = ["tests"]

