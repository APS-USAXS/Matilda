[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"


[project]
name = "Matilda"
dynamic = ["version"]
description = "Live data processing package for USAXS/SAXS/WAXS instrument"
readme = "README.md"
authors = [
    { name = "Jan Ilavsky", email = "ilavsky@anl.gov" },
]
# license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core runtime dependencies (verified used in source code).
# GUI dependencies (PyQt6, pyqtgraph) are listed separately below so the
# headless server install can omit them if needed.
# NOTE: netcdf4, pandas, tqdm, xarray were listed previously but do not
#       appear to be imported in any current source file — removed pending
#       confirmation that they are not needed.
dependencies = [
    "h5py",
    "matplotlib",       # used in plotData.py; target for replacement with pyqtgraph
    "numpy",
    "pyFAI",
    "requests",
    "scipy",
    "tifffile",
]

[project.optional-dependencies]
# Install with: pip install matilda[gui]
gui = [
    "PyQt6",
    "pyqtgraph",
]
# Install with: pip install matilda[dev]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
# Allows running 'matilda' on the command line after install.
# TODO: matilda.py currently uses if __name__ == "__main__" — a thin
#       entry-point wrapper function should be added before this works.
# matilda = "matilda.matilda:main"

[tool.hatch.build.targets.wheel]
# Only package the matilda/ sub-directory, not the repo root.
packages = ["matilda"]
